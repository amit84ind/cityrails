name: Build iOS IPA & Android AAB

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch: # Allows manual trigger from GitHub Actions tab

jobs:
  build-ios:
    name: Build iOS IPA
    runs-on: macos-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install Dependencies
        run: flutter pub get

      - name: Build iOS IPA (Unsigned / No-Codesign)
        run: flutter build ipa --no-codesign

      - name: Upload iOS Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: CityRails-iOS-IPA
          path: build/ios/archive/Runner.xcarchive

  build-android:
    name: Build Android AAB & APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install Dependencies
        run: flutter pub get

      - name: Build Android Release App Bundle (AAB)
        run: flutter build appbundle

      - name: Build Android Release APK
        run: flutter build apk

      - name: Upload Android AAB Artifact
        uses: actions/upload-artifact@v4
        with:
          name: CityRails-Android-AAB
          path: build/app/outputs/bundle/release/app-release.aab

      - name: Upload Android APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: CityRails-Android-APK
          path: build/app/outputs/flutter-apk/app-release.apk
